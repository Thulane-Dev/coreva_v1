{% load static %}

<!-- =========================================================
     BACK DESTINATION
========================================================= -->

{% firstof next_url back_url "#" as final_back_url %}


<!-- =========================================================
     DESKTOP BACK BUTTON
========================================================= -->

<div class="d-none d-md-block">

    <a
        href="{{ final_back_url }}"
        class="coreva_background_lg"
    >
        <i class="bi bi-chevron-left"></i>
        <span>Back</span>
    </a>

</div>


<!-- =========================================================
     COREVA MOBILE TOP NAVBAR
========================================================= -->

<nav class="cv-mobile-topbar fixed-top">

    <!-- BACK -->

    <a
        href="{{ final_back_url }}"
        class="cv-mobile-topbar-back"
        aria-label="Go back"
    >
        <i class="bi bi-chevron-left"></i>
    </a>


    <!-- BRAND / PAGE NAME -->

    <a
        href="{{ brand_url|default:'#' }}"
        class="cv-mobile-topbar-brand"
        aria-label="{{ brand_name|default:'Coreva' }}"
    >
        {{ brand_name|default:'Coreva' }}
    </a>


    <!-- LOGOUT -->

    <a
        href="#"
        class="cv-mobile-topbar-logout d-none"
        aria-label="Logout"
        title="Logout"
    >
        <i class="bi bi-box-arrow-right"></i>
    </a>

</nav>
