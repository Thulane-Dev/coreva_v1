{% if incidents %}
<!-- divider  -->
{% include 'partials/incident_component_partial.html' %}
<!-- divider  -->
{% else %}
<!-- ========================= EMPTY STATE ========================== -->
<section class="incidents_empty_section">
    <div class="incident_empty_icon">
        <span class="material-symbols-outlined"> emergency </span>
    </div>
    <h5 class="incident_empty_title">No incidents today</h5>
    <p class="incident_empty_text">
        No incidents have been recorded for this project today.
    </p>
    <div class="incident_empty_actions">
        <a data-bs-toggle="offcanvas" href="#addIncidentOffcanvas" aria-controls="addIncidentOffcanvas">
        <button type="button" class="btn incidents_add_btn w-100">
            <i class="bi bi-plus-lg"></i> Add Incident
        </button>
        </a>
        <a href="{% url 'incidents:project-incidents' project.uuid %}?next={{ request.get_full_path|urlencode }}">
        <button type="button" class="btn incidents_history_btn w-100">
            View all incidents <i class="bi bi-arrow-right"></i>
        </button>
        </a>
    </div>
</section>
{% endif %}
