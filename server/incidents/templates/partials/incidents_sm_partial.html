<a
    id="IncidentsSessionSM"
    href="{% url 'incidents:project-incidents' project.uuid %}?next={{ request.get_full_path|urlencode }}&section=workspace"
    class="d-block d-md-none"
    hx-swap-oob="outerHTML"
>
    <div class="coreva-action-block">
        <div class="coreva-action-icon coreva-icon-red">
        <i class="bi bi-exclamation-triangle"></i>
        </div>

        <div class="coreva-action-content">
            <span class="coreva-action-title">Incidents</span>
            <span class="coreva-action-subtitle">Site incidents</span>
        </div>
        {% if incidents %}
        <span class="coreva-action-badge">{{incidents|length}}</span>
        {% endif %}
    </div>
</a>
