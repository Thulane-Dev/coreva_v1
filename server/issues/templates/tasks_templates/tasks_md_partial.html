{% if project_data.open_tasks %}
<!-- divider  -->
{% include 'partials/task_component_partial.html' %}
<!-- EMPTY TASK STATE -->
{% else %}
<div class="operations-card empty-operation-card h-100">
    <div class="empty-state">
        <div class="empty-icon task-empty-icon">
        <i class="bi bi-list-check"></i>
        </div>

        <h5>No Open Tasks</h5>

        <p>There are currently no open tasks for this project.</p>

        <div class="empty-actions">
        <a
            data-bs-toggle="offcanvas" href="#addTasksOffcanvas" aria-controls="addTasksOffcanvas"
            class="empty-primary-button"
        >
            <i class="bi bi-plus-lg"></i>
            Add Task
        </a>

        <a href="{% url 'issues:project-tasks' project.uuid %}?next={{ request.get_full_path|urlencode }}">
            <button type="button" class="empty-secondary-button">
            View History
            <i class="bi bi-arrow-right"></i>
            </button>
        </a>
        </div>
    </div>
</div>
{% endif %}
