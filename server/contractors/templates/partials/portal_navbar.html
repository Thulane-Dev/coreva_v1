@media (max-width: 700px) {

    }


    .cv-portal-navbar-inner {
        height: 58px;

        padding: 0 14px;
    }

    }

        display: flex;
    }

        height: 31px;

        border-radius: 8px;

    }

    }


    .cv-portal-brand-text small {
        font-size: 9px;
    }


    /* =====================================
       MOBILE DROPDOWN
       ===================================== */

    .cv-portal-mobile-menu {
        position: absolute;

        top: 58px;
        left: 0;
        right: 0;

        display: flex;
        flex-direction: column;

        gap: 6px;

        padding: 10px 14px 14px;

        background: #172A46;

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        box-shadow:
            0 8px 20px rgba(15, 23, 42, 0.18);

        opacity: 0;
        visibility: hidden;

        transform: translateY(-8px);

        transition:
            opacity 0.18s ease,
            visibility 0.18s ease,
            transform 0.18s ease;
    }


    .cv-portal-mobile-menu.is-open {
        opacity: 1;

        visibility: visible;

        transform: translateY(0);
    }


    /* =====================================
       MOBILE LINK
       ===================================== */

    .cv-portal-mobile-link {
        min-height: 48px;

        display: flex;
        align-items: center;

        gap: 11px;

        padding: 0 12px;

        border-radius: 9px;

        color: rgba(255, 255, 255, 0.72);

        text-decoration: none;

    }


    .cv-portal-mobile-link:hover {
        background: rgba(255, 255, 255, 0.06);

        color: #ffffff;
    }


    .cv-portal-mobile-link > i:first-child {
        font-size: 16px;
    }


    .cv-portal-mobile-link > i:last-child {
        margin-left: auto;

        font-size: 12px;

        opacity: 0.45;
    }

       MOBILE SIGN UP
       ===================================== */

        min-height: 46px;

        display: flex;

</style>


<script>
    document.addEventListener("DOMContentLoaded", function () {

    const menuButton = document.getElementById(
        "cvPortalMenuButton"
    );

    const mobileMenu = document.getElementById(
        "cvPortalMobileMenu"
    );


    if (!menuButton || !mobileMenu) {
        return;
    }


    /*
     * Toggle mobile menu
     */

    menuButton.addEventListener("click", function (event) {

        event.stopPropagation();

        const isOpen =
            mobileMenu.classList.toggle("is-open");


        menuButton.setAttribute(
            "aria-expanded",
            isOpen
        );


        const icon =
            menuButton.querySelector("i");


        if (!icon) {
            return;
        }


        if (isOpen) {

            icon.classList.remove("bi-list");

            icon.classList.add("bi-x-lg");

        } else {

            icon.classList.remove("bi-x-lg");

            icon.classList.add("bi-list");

        }

    });


    /*
     * Close when clicking outside
     */

    document.addEventListener("click", function (event) {

        if (
            !event.target.closest(
                ".cv-portal-navbar"
            )
        ) {

            closePortalMenu();

        }

    });


    /*
     * Close after clicking a mobile link
     */

    mobileMenu
        .querySelectorAll("a")
        .forEach(function (link) {

            link.addEventListener(
                "click",
                function () {

                    closePortalMenu();

                }
            );

        });


    /*
     * Close menu
     */

    function closePortalMenu() {

        mobileMenu.classList.remove(
            "is-open"
        );


        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );


        const icon =
            menuButton.querySelector("i");


        if (!icon) {
            return;
        }


        icon.classList.remove(
            "bi-x-lg"
        );

        icon.classList.add(
            "bi-list"
        );

    }

});
</script>
